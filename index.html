<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>سفر عشق ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<img id="global-bg" src="assets/bg2.png" draggable="false">

<div id="game">
  <div id="hud">
    <div id="stage">مرحله ۱</div>
    <div id="heartCounter">❤️ <span id="count">0</span>/10</div>
  </div>

  <div id="world">
    <div id="platforms"></div>
    <div id="hearts"></div>
    <img id="player" src="assets/file_00000000b874820a9622b5b64da01022.png" draggable="false">
  </div>

  <div id="controls">
    <div class="move-btns">
      <button id="left">➡️</button>
      <button id="right">⬅️</button>
    </div>
    <div class="jump-btn">
      <button id="jump">⬆️</button>
    </div>
  </div>
</div>

<div id="messageBox">
  <div id="messageText"></div>
</div>

<div id="finishScreen">
  <h1>🎉 تولدت مبارک مامیییی ❤️</h1>
  <p>
    تو واقعا بهترین اتفاق زندگیمی...<br><br>
    امیدوارم همیشه بخندی...<br>
    همیشه سالم باشی...<br>
    همیشه خوشحال باشی...<br><br>
    من همیشههه کنارت می‌مونم...<br><br>
      خیلیییی دوست دارم تا ابد عاشقتممم  🌙❤️☀️
  </p>
  <button id="restartBtn">دوباره بازی کن</button>
</div>

<audio id="bgMusic" loop src="assets/music.mp3"></audio>

<script src="main.js"></script>
</body>
</html>
