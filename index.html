<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شمیم من 💖</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>

  <!-- هشدار چرخش گوشی -->
  <div id="rotate-overlay">
    <div class="rotate-content">
      <div class="phone-icon">📱</div>
      <h2>لطفاً گوشی خود را افقی کنید</h2>
      <p>برای تجربه بهتر بازی، چرخش خودکار گوشی را روشن کرده و آن را افقی نگه دارید 🔄</p>
    </div>
  </div>

  <div id="game">
    <div id="world">
      <div id="platforms"></div>
      <div id="hearts"></div>
      <!-- اینجا اصلاح شد و دقیقاً ست شد با player.png -->
      <img id="player" src="assets/player.png" alt="Player">
    </div>

    <!-- اطلاعات بالای صفحه -->
    <div id="hud">
      <div id="heartCounter">💖 <span id="count">0</span>/10</div>
      <div id="stage">مرحله ۱</div>
    </div>

    <!-- دکمه‌های بازی -->
    <div id="controls">
      <div class="move-btns">
        <button id="right">➔</button>
        <button id="left">⬅</button>
      </div>
      <button id="jump" class="jump-btn">⬆</button>
    </div>

    <!-- باکس نمایش پیام‌ها -->
    <div id="messageBox">
      <p id="messageText"></p>
    </div>

    <!-- صفحه پایان -->
    <div id="finishScreen">
      <h1>تولدت مبارک عشقم! 🎉💖</h1>
      <p>تو قشنگ‌ترین اتفاق زندگی منی... مرسی که تا آخر بازی همراهم بودی 🥰</p>
      <button id="restartBtn">شروع مجدد 🔄</button>
    </div>
  </div>

  <audio id="bgMusic" src="assets/music.mp3" loop></audio>
  <script src="main.js"></script>
</body>
</html>
